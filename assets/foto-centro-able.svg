<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Centro de monitoreo ABLE</title>
  <desc id="desc">Panel de monitoreo ABLE con camaras, eventos y protocolos activos en rojo y negro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset=".55" stop-color="#090b10"/>
      <stop offset="1" stop-color="#26050a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202632"/>
      <stop offset="1" stop-color="#0c0f15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="460" fill="url(#bg)"/>
  <rect x="54" y="62" width="612" height="318" rx="16" fill="#11161f" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <rect x="78" y="96" width="352" height="214" rx="10" fill="url(#screen)" stroke="#ff4050" stroke-opacity=".42"/>
  <path d="M92 270c60-78 106-38 164-90 48-44 102-30 158-82" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
  <path d="M96 250l88-38 72 28 70-76 74 18" fill="none" stroke="#ff4050" stroke-width="4" opacity=".78"/>
  <circle cx="184" cy="212" r="9" fill="#ff4050" filter="url(#glow)"/>
  <circle cx="326" cy="164" r="9" fill="#ff4050" filter="url(#glow)"/>
  <rect x="454" y="96" width="174" height="54" rx="8" fill="#191f2a"/>
  <rect x="454" y="166" width="174" height="54" rx="8" fill="#191f2a"/>
  <rect x="454" y="236" width="174" height="54" rx="8" fill="#191f2a"/>
  <path d="M472 124h52M472 194h52M472 264h52" stroke="#ff4050" stroke-width="5" stroke-linecap="round"/>
  <path d="M540 124h62M540 194h62M540 264h62" stroke="#ffffff" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
  <rect x="128" y="342" width="464" height="18" rx="9" fill="#2b3441"/>
  <rect x="300" y="360" width="120" height="44" fill="#242b35"/>
  <rect x="238" y="398" width="244" height="18" rx="9" fill="#151a22"/>
