<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Cerradura electronica ABLE</title>
  <desc id="desc">Cerradura electronica negra sobre puerta clara, con teclado numerico, manilla horizontal, lector circular y estetica roja y negra ABLE.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6dbd3"/>
      <stop offset=".5" stop-color="#aeb6ad"/>
      <stop offset="1" stop-color="#6f766f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8c8b5"/>
      <stop offset=".42" stop-color="#f0dfca"/>
      <stop offset=".72" stop-color="#cdbba6"/>
      <stop offset="1" stop-color="#f4e4cf"/>
    </linearGradient>
    <linearGradient id="blackGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262930"/>
      <stop offset=".16" stop-color="#050609"/>
      <stop offset=".52" stop-color="#0e1016"/>
      <stop offset=".78" stop-color="#010103"/>
      <stop offset="1" stop-color="#272a32"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343841"/>
      <stop offset=".22" stop-color="#050609"/>
      <stop offset=".74" stop-color="#11131a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4050"/>
      <stop offset="1" stop-color="#b40712"/>
    </linearGradient>
    <linearGradient id="blueRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72b8ff"/>
      <stop offset=".52" stop-color="#1d64d8"/>
      <stop offset="1" stop-color="#071b57"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".46"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="720" height="460" fill="#07080b"/>
  <rect width="255" height="460" fill="url(#room)" opacity=".58"/>
  <g filter="url(#blur)" opacity=".62">
    <path d="M64 84c46-36 110-32 145 10 27 34 17 80-17 102-43 27-103 1-123 39-13 25 6 53 29 65" fill="none" stroke="#eef2e8" stroke-width="18" stroke-linecap="round"/>
    <rect x="58" y="263" width="88" height="64" rx="12" fill="#e9e5dd"/>
    <rect x="92" y="323" width="10" height="60" rx="5" fill="#655e56"/>
    <path d="M168 276c18-20 40-22 63-7" stroke="#74655d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="120" cy="248" r="9" fill="#c8bbae"/>
  </g>
  <rect x="255" width="465" height="460" fill="url(#wood)"/>
  <g opacity=".42">
    <path d="M294 0c-24 78-22 145 2 218 25 75 22 150-6 242M390 0c-18 90-13 158 12 238 22 68 14 144-10 222M484 0c22 82 17 154-7 225-22 66-22 143 1 235M595 0c-21 74-18 148 8 221 25 70 24 146-4 239" fill="none" stroke="#9f8a77" stroke-width="2" opacity=".38"/>
    <path d="M286 40h390M278 113h410M268 332h430" stroke="#fff" stroke-opacity=".15" stroke-width="2"/>
  </g>
  <path d="M255 0v460" stroke="#07080b" stroke-opacity=".28" stroke-width="3"/>
  <ellipse cx="455" cy="414" rx="164" ry="30" fill="#000" opacity=".22" filter="url(#softGlow)"/>
  <g transform="translate(333 48)" filter="url(#shadow)">
    <rect x="0" y="0" width="154" height="358" rx="16" fill="url(#blackGloss)" stroke="#4b4f57" stroke-width="3"/>
    <path d="M23 19h93c-62 100-72 211-88 316H18c-8 0-13-5-13-14V17c0 24 8 35 18 2Z" fill="#fff" opacity=".09"/>
    <path d="M117 3c-19 118-34 224-92 352" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".055"/>
    <g fill="#f5f7fb" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity=".9">
      <text x="48" y="58">1</text>
      <text x="77" y="58">2</text>
      <text x="106" y="58">3</text>
      <text x="48" y="82">4</text>
      <text x="77" y="82">5</text>
      <text x="106" y="82">6</text>
      <text x="48" y="106">7</text>
      <text x="77" y="106">8</text>
      <text x="106" y="106">9</text>
      <text x="77" y="130">0</text>
    </g>
    <g opacity=".92">
      <rect x="68" y="77" width="18" height="14" rx="2" fill="none" stroke="#f5f7fb" stroke-width="1.5"/>
      <path d="M72 77v-5c0-4 3-7 6-7s6 3 6 7v5" fill="none" stroke="#f5f7fb" stroke-width="1.5"/>
    </g>
    <text x="77" y="315" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="20" font-weight="800" text-anchor="middle">ABLE</text>
    <text x="77" y="334" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">LOCK</text>
    <g transform="translate(20 167)">
      <rect x="0" y="0" width="278" height="54" rx="13" fill="url(#handle)" stroke="#2b2f38" stroke-width="3"/>
      <path d="M22 11h236c-43 14-97 20-161 21-39 1-66 5-86 12Z" fill="#fff" opacity=".08"/>
      <circle cx="50" cy="27" r="22" fill="#050609" stroke="#3a3f4c" stroke-width="3"/>
      <circle cx="50" cy="27" r="14" fill="none" stroke="url(#blueRing)" stroke-width="4"/>
      <circle cx="50" cy="27" r="6" fill="#11151d"/>
    </g>
  </g>
  <g transform="translate(62 54)">
    <rect width="222" height="84" rx="8" fill="#10141b" fill-opacity=".88" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="22" y="34" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="21" font-weight="800">CERRADURA</text>
    <text x="22" y="61" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="17" font-weight="800">ELECTRONICA</text>
  </g>
  <g transform="translate(520 286)">
    <rect width="134" height="76" rx="10" fill="#10141b" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="16" y="18" width="42" height="26" rx="5" fill="url(#red)"/>
    <path d="M27 31h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="31" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="13" font-weight="800">RFID / PIN</text>
    <text x="70" y="51" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="13" font-weight="800">ACTIVO</text>
  </g>
</svg>
