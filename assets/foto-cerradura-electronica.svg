<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Cerradura electronica ABLE</title>
  <desc id="desc">Escena tecnica roja y negra con una cerradura electronica de hotel o empresa, teclado numerico, manilla horizontal y lectura RFID PIN.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset=".52" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#25050a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4050"/>
      <stop offset="1" stop-color="#b40712"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b35"/>
      <stop offset=".46" stop-color="#12161e"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="lockGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363b45"/>
      <stop offset=".15" stop-color="#050609"/>
      <stop offset=".5" stop-color="#11141b"/>
      <stop offset=".72" stop-color="#010103"/>
      <stop offset="1" stop-color="#2b303a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#353a44"/>
      <stop offset=".28" stop-color="#050609"/>
      <stop offset=".78" stop-color="#11141b"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="blueRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76bdff"/>
      <stop offset=".5" stop-color="#1f66df"/>
      <stop offset="1" stop-color="#071b57"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="13" flood-color="#000" flood-opacity=".56"/>
    </filter>
  </defs>
  <rect width="720" height="460" fill="url(#sky)"/>
  <path d="M0 330 C140 282 240 350 376 306 C492 268 590 286 720 238 L720 460 L0 460 Z" fill="#11151d"/>
  <path d="M0 360 C160 320 282 384 430 340 C530 310 620 320 720 292 L720 460 L0 460 Z" fill="#090b10"/>
  <g opacity=".26" stroke="#ffffff" stroke-width="1">
    <path d="M34 98h652M34 156h652M34 214h652M34 272h652"/>
    <path d="M96 48v330M188 48v330M280 48v330M372 48v330M464 48v330M556 48v330M648 48v330"/>
  </g>
  <path d="M0 394h720" stroke="#ff4050" stroke-opacity=".62" stroke-width="3"/>
  <g opacity=".7">
    <rect x="34" y="378" width="18" height="44" fill="#2e3440"/>
    <rect x="102" y="366" width="18" height="56" fill="#2e3440"/>
    <rect x="170" y="382" width="18" height="40" fill="#2e3440"/>
    <rect x="610" y="360" width="18" height="62" fill="#2e3440"/>
    <rect x="672" y="374" width="18" height="48" fill="#2e3440"/>
  </g>
  <text x="38" y="58" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="28" font-weight="700">CERRADURA</text>
  <text x="38" y="92" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="18" font-weight="700">ELECTRONICA HOTEL / EMPRESA</text>
  <g opacity=".72">
    <path d="M124 344h190M568 344h98" stroke="#ff4050" stroke-width="2" stroke-linecap="round"/>
    <path d="M164 344v-148h354v148" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <path d="M182 196h318M182 234h318M182 272h318" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  </g>
  <ellipse cx="448" cy="388" rx="196" ry="36" fill="#ff3040" opacity=".18" filter="url(#soft)"/>
  <g transform="translate(300 70)" filter="url(#shadow)">
    <rect x="22" y="0" width="166" height="336" rx="18" fill="url(#lockGloss)" stroke="#3d4450" stroke-width="3"/>
    <rect x="39" y="20" width="132" height="292" rx="10" fill="#090b10" opacity=".34"/>
    <path d="M49 18h84c-25 58-41 126-53 203-5 31-13 62-24 92H47c-7 0-11-4-11-11V24c0 8 5 11 13-6Z" fill="#fff" opacity=".075"/>
    <path d="M158 10c-10 72-27 149-49 231-7 25-14 49-23 73" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".035"/>
    <g fill="#f5f7fb" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle" opacity=".96">
      <text x="77" y="62">1</text>
      <text x="105" y="62">2</text>
      <text x="133" y="62">3</text>
      <text x="77" y="87">4</text>
      <text x="105" y="87">5</text>
      <text x="133" y="87">6</text>
      <text x="77" y="112">7</text>
      <text x="105" y="112">8</text>
      <text x="133" y="112">9</text>
      <text x="105" y="137">0</text>
    </g>
    <g opacity=".95" transform="translate(94 151)">
      <rect x="0" y="8" width="22" height="16" rx="3" fill="none" stroke="#f5f7fb" stroke-width="1.7"/>
      <path d="M5 8V5c0-6 4-10 8-10s8 4 8 10v3" fill="none" stroke="#f5f7fb" stroke-width="1.7"/>
    </g>
    <text x="105" y="280" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="22" font-weight="800" text-anchor="middle">ABLE</text>
    <text x="105" y="301" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">LOCK</text>
    <g transform="translate(0 164)">
      <rect x="0" y="0" width="292" height="58" rx="13" fill="url(#handle)" stroke="#313743" stroke-width="3"/>
      <path d="M21 12h250c-52 15-118 21-194 22-31 0-55 4-65 12Z" fill="#fff" opacity=".08"/>
      <path d="M68 45h206" stroke="#000" stroke-opacity=".54" stroke-width="4" stroke-linecap="round"/>
      <circle cx="52" cy="29" r="24" fill="#050609" stroke="#3b424e" stroke-width="3"/>
      <circle cx="52" cy="29" r="15" fill="none" stroke="url(#blueRing)" stroke-width="5"/>
      <circle cx="52" cy="29" r="7" fill="#10141b"/>
    </g>
  </g>
  <g transform="translate(546 244)">
    <rect width="128" height="80" rx="10" fill="#10141b" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="16" y="19" width="42" height="27" rx="6" fill="url(#red)"/>
    <path d="M27 32h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="33" fill="#f4f6f8" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="13" font-weight="800">RFID / PIN</text>
    <text x="70" y="54" fill="#ff4050" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="13" font-weight="800">ACTIVO</text>
  </g>
  <g opacity=".68" stroke="#ff4050" stroke-linecap="round">
    <path d="M270 138h30M594 206h38M232 294h46" stroke-width="3"/>
    <circle cx="300" cy="138" r="4" fill="#ff4050" filter="url(#glow)"/>
    <circle cx="594" cy="206" r="4" fill="#ff4050" filter="url(#glow)"/>
    <circle cx="278" cy="294" r="4" fill="#ff4050" filter="url(#glow)"/>
  </g>
</svg>
